name: Bug report
description: Report a reproducible problem
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Keep reports concise and remove credentials, private identifiers, and unrelated logs.
  - type: input
    id: repo_version
    attributes:
      label: Version / branch / commit
      description: Exact version, branch, release, or commit SHA if known.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal steps to reproduce.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant logs / evidence
      description: Paste only the relevant section. Remove secrets and private data.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I checked existing issues.
          required: true
        - label: I removed credentials and private data.
          required: true
